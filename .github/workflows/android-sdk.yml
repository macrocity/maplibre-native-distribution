name: Build Android SDK Renderer Lifecycle Performance Candidate
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full renderer source commit
        required: true
        default: 704dd4c299e8e253bbbe6faa67fee81aeff42dcb
      version:
        description: Maven version
        required: true
        default: 13.6.1-perf-20261016-lifecycle-control
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64, armeabi-v7a, x86]
    env:
      SOURCE_REVISION: ${{ inputs.revision }}
      SDK_VERSION: ${{ inputs.version }}
      SDK_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_VERSION" =~ ^13\.6\.1-perf-[0-9A-Za-z.-]+$ ]]
      - uses: actions/checkout@v4
        with:
          repository: macrocity/maplibre-native
          ref: ${{ inputs.revision }}
          path: .local/source
          persist-credentials: false
      - name: Initialize native dependencies
        working-directory: .local/source
        run: |
          git submodule update --init --recursive --depth 1 -- $(git config --file .gitmodules --get-regexp path | awk '{print $2}' | grep '^vendor/' | grep -v '^vendor/wgpu-native$')
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install native build tools
        run: |
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-34'
          echo "cmake.dir=$(dirname "$(dirname "$(command -v cmake)")")" >> .local/source/platform/android/local.properties
      - name: Build Maven publication
        working-directory: .local/source/platform/android
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            --init-script "$GITHUB_WORKSPACE/android-publication.gradle" \
            -Dorg.gradle.jvmargs=-Xmx3072m \
            -Pmaplibre.abis="$SDK_ABI" \
            -PpublicationRepositoryUrl="file://$GITHUB_WORKSPACE/.local/maven" \
            :MapLibreAndroid:publishOpenglreleasePublicationToConfiguredRepository
          cp ../../LICENSE.md ../../LICENSES.core.md "$GITHUB_WORKSPACE/.local/maven/"
      # The SDK ships libmaplibre.so stripped. Keep the unstripped library of the same build: a crash
      # reporter reads files and lines from it (merge-android.py checks that the two match).
      - name: Keep the unstripped native library
        working-directory: .local/source/platform/android
        run: |
          libraries=(MapLibreAndroid/build/intermediates/merged_native_libs/openglRelease/*/out/lib/"$SDK_ABI"/libmaplibre.so)
          [ "${#libraries[@]}" -eq 1 ] && [ -f "${libraries[0]}" ] || { echo "::error::expected one unstripped libmaplibre.so for $SDK_ABI: ${libraries[*]}"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/.local/symbols/$SDK_ABI"
          cp "${libraries[0]}" "$GITHUB_WORKSPACE/.local/symbols/$SDK_ABI/"
          file "$GITHUB_WORKSPACE/.local/symbols/$SDK_ABI/libmaplibre.so"
      - uses: actions/upload-artifact@v4
        with:
          name: perf-android-${{ matrix.abi }}
          path: .local/maven
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: perf-android-symbols-${{ matrix.abi }}
          path: .local/symbols
          retention-days: 1
          if-no-files-found: error
  package:
    needs: [build, native-tests]
    runs-on: ubuntu-24.04
    env:
      SOURCE_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: perf-android-*
          path: .local/architectures
      - name: Restore the packager's ABI directory names
        run: |
          for abi in arm64-v8a x86_64 armeabi-v7a x86; do
            mv ".local/architectures/perf-android-$abi" ".local/architectures/android-$abi"
            mv ".local/architectures/perf-android-symbols-$abi" ".local/architectures/android-symbols-$abi"
          done
          python3 merge-android.py .local/architectures .local/release
      - uses: actions/upload-artifact@v4
        with:
          name: perf-android-maven
          path: .local/release/android-maven.zip
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: perf-android-native-symbols
          path: .local/release/android-native-symbols.zip
          retention-days: 1
          if-no-files-found: error

  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@v4
        with:
          repository: macrocity/maplibre-native
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Initialize native dependencies
        run: |
          git submodule update --init --recursive --depth 1 -- $(git config --file .gitmodules --get-regexp path | awk '{print $2}' | grep '^vendor/' | grep -v '^vendor/wgpu-native$')
      - name: Install headless OpenGL test dependencies
        run: |
          .github/scripts/install-linux-deps
          sudo apt-get install -y ninja-build ccache xvfb libegl1-mesa-dev libgl1-mesa-dev libwayland-dev wayland-protocols libxkbcommon-dev
      - name: Compile maintained SDK OpenGL tests
        run: |
          cmake --preset linux-opengl -DMLN_WITH_CLANG_TIDY=OFF
          # Compile new test objects first; catch source/API mistakes before the full SDK runner.
          cmake --build build-linux-opengl --target test/CMakeFiles/mbgl-test.dir/renderer/android_renderer_actor.test.cpp.o --parallel 2
          cmake --build build-linux-opengl --target test/CMakeFiles/mbgl-test.dir/renderer/android_emulator_render_policy.test.cpp.o --parallel 2
          if [ -f test/tile/inactive_tile_cache.test.cpp ]; then
            cmake --build build-linux-opengl --target test/CMakeFiles/mbgl-test.dir/tile/inactive_tile_cache.test.cpp.o --parallel 2
          fi
          cmake --build build-linux-opengl --target mbgl-test-runner --parallel 2
      - name: Run renderer lifecycle, actor, Guest ANGLE and bounded tile-cache regressions
        run: |
          timeout --signal=TERM --kill-after=10s 240s xvfb-run -a build-linux-opengl/mbgl-test-runner --gtest_filter='AndroidRendererActor.*:Actor.*:VertexArrayBindingCache.*:Buckets.*:CustomLayer.*:GuestAngleDrawableReuse.*:InactiveTileCache.*:Source.*:TileCache.*:StyleDiff.*'
